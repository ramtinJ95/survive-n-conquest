services:
  dev:
    command: bun run dev --host 127.0.0.1 --port $PORT --strictPort
    health: /
    preview: { title: Game (dev server) }
    env:
      # Vite refuses a Host it does not know, and a preview arrives with the pylon's .ts.net name.
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: .ts.net
